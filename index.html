<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Ichigo Bankai Edition</title>
    <!-- Importação de fonte estilizada inspirada em Bleach -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b0b0e;
            color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Imagem de Fundo com Overlay Escuro */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.alphacoders.com/603/thumb-1920-603176.jpg') no-repeat center center/cover;
            opacity: 0.15;
            z-index: -2;
        }

        /* Layout Principal com Personagem Lateral */
        .main-wrapper {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 30px;
            align-items: center;
            justify-content: center;
        }

        /* Foto Lateral do Ichigo */
        .character-sidebar {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 300px;
        }

        .character-sidebar img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.4);
            border: 2px solid #e74c3c;
            object-fit: cover;
        }

        @media (min-width: 900px) {
            .character-sidebar {
                display: flex;
            }
        }

        .content-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.5rem;
            color: #e74c3c;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(231, 76, 60, 0.6);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #a0a0a0;
            margin-bottom: 30px;
            text-align: center;
            font-size: 0.95rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .card {
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border-top: 4px solid #34495e;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.6);
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: #ffffff;
            font-size: 1.1rem;
            text-align: center;
        }

        .transform-name {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 15px;
            font-style: italic;
            min-height: 20px;
            text-align: center;
        }

        /* Custom Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2c2c35;
            transition: .3s;
            border-radius: 34px;
            border: 1px solid #444;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        /* Estados Ativos com Cores Personalizadas para cada Transformação */
        input:checked + .slider { background-color: var(--active-color, #e74c3c); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* Estilizações individuais por card (Transformações do Ichigo) */
        .card[data-index="1"] { --active-color: #3498db; } /* Shikai - Azul */
        .card[data-index="2"] { --active-color: #e74c3c; } /* Bankai - Vermelho */
        .card[data-index="3"] { --active-color: #e67e22; } /* Hollow - Laranja */
        .card[data-index="4"] { --active-color: #9b59b6; } /* Vasto Lorde - Roxo */
        .card[data-index="5"] { --active-color: #2ecc71; } /* Mugetsu - Verde Espectral */
        .card[data-index="6"] { --active-color: #f1c40f; } /* Fullbring - Dourado */
        .card[data-index="7"] { --active-color: #e84393; } /* True Bankai - Rosa/Magenta */
        .card[data-index="8"] { --active-color: #00cec9; } /* Hell Verse - Ciano */
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Foto lateral do Ichigo -->
        <div class="character-sidebar">
            <img src="https://images.alphacoders.com/132/thumb-1920-1320392.png" alt="Ichigo Kurosaki">
        </div>

        <div class="content-container">
            <h1>Soul Society Panel</h1>
            <p class="subtitle">Controle de Falhas & Ativação de Transformações Espirituais</p>

            <div class="grid-container" id="painel-reles">
                <!-- Os cards serão injetados aqui dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        const databaseURL = "https://painel-wi-fi-default-rtdb.firebaseio.com";
        const container = document.getElementById('painel-reles');
        const totalReles = 8;

        // Nomes das transformações do Ichigo associadas a cada relé
        const transformacoes = [
            "Shikai (Zangetsu)",
            "Bankai (Tensa Zangetsu)",
            "Máscara Hollow",
            "Vasto Lorde",
            "Mugetsu (Final Getsuga)",
            "Fullbring Mode",
            "True Bankai",
            "Hell Verse Mode"
        ];

        // Cria os cards na tela automaticamente com os nomes das transformações
        for (let i = 1; i <= totalReles; i++) {
            const defectKey = `DEFEITO${i}`;
            const nomeTransformacao = transformacoes[i - 1];
            
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-index', i);
            card.innerHTML = `
                <h3>Relé ${i}</h3>
                <div class="transform-name">${nomeTransformacao}</div>
                <label class="switch">
                    <input type="checkbox" id="${defectKey}" onchange="atualizarFirebase('${defectKey}', this.checked)">
                    <span class="slider"></span>
                </label>
            `;
            container.appendChild(card);
        }

        // Envia o estado atualizado via requisição HTTP PUT para o Firebase
        function atualizarFirebase(chave, status) {
            fetch(`${databaseURL}/${chave}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(status)
            })
            .then(res => {
                if (!res.ok) throw new Error("Erro na resposta do servidor");
                return res.json();
            })
            .then(data => console.log(`Atualizado ${chave}:`, data))
            .catch(error => console.error("Erro ao enviar comando:", error));
        }

        // Busca todos os estados do banco de dados Firebase
        function buscarEstadosIniciais() {
            fetch(`${databaseURL}/.json`)
                .then(res => {
                    if (!res.ok) throw new Error("Erro ao conectar com o Firebase");
                    return res.json();
                })
                .then(dados => {
                    if (!dados) return;
                    for (let i = 1; i <= totalReles; i++) {
                        const defectKey = `DEFEITO${i}`;
                        const checkbox = document.getElementById(defectKey);
                        if (checkbox && dados[defectKey] !== undefined) {
                            const valor = dados[defectKey];
                            checkbox.checked = (valor === true || valor === 1 || valor === "true");
                        }
                    }
                })
                .catch(err => console.log("Aguardando resposta ou sem dados no Firebase..."));
        }

        // Sincroniza ao abrir e repete a cada 3 segundos
        buscarEstadosIniciais();
        setInterval(buscarEstadosIniciais, 3000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interativo - Ichigo Kurosaki</title>
    <!-- Importando a fonte do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Camada de Fundo Dinâmico com Transição Suave */
        #bg-transition-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.35);
            transform: scale(1.05);
            transition: background-image 1s ease-in-out;
            z-index: -2;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.75);
            z-index: -1;
        }
        
        #main-title { 
            font-family: 'Cinzel Decorative', Georgia, serif !important;
            font-size: 2.2rem;
            color: #f1f5f9; 
            margin-bottom: 5px; 
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            letter-spacing: 2px;
            text-align: center;
            transition: text-shadow 0.6s ease, color 0.6s ease;
            z-index: 1;
        }

        p { color: #cbd5e1; margin-bottom: 25px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-weight: 600; z-index: 1; }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            align-items: flex-start;
            z-index: 1;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            flex: 1;
            min-width: 300px;
        }

        .character-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 320px;
            position: sticky;
            top: 20px;
            transition: border-color 0.6s ease, box-shadow 0.6s ease;
        }

        .character-image-container {
            width: 100%;
            height: 380px;
            border-radius: 12px;
            overflow: hidden;
            background: #090d16;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .character-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Centralizado focado na parte superior (rosto/cabelo) */
            object-position: center 20%; 
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .character-info {
            margin-top: 15px;
            text-align: center;
        }

        .character-info h3 {
            margin: 0;
            color: #38bdf8;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .character-info span {
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border-top: 4px solid #475569;
            transition: transform 0.2s, background 0.2s;
        }
        .card:hover { 
            transform: translateY(-2px); 
            background: rgba(30, 41, 59, 0.85);
        }
        .card h3 { margin: 0 0 15px 0; color: #f1f5f9; font-size: 1rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569;
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); } 
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>

    <div id="bg-transition-layer"></div>
    <div class="bg-overlay"></div>

    <h1 id="main-title">PAINEL DE CONTROLE - BLEACH</h1>
    <p>Monitoramento de Relés e Transformações do Ichigo</p>

    <div class="main-container">
        <div class="grid-container" id="painel-reles"></div>

        <div class="character-card" id="char-card-box">
            <div class="character-image-container">
                <img id="char-image" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400" alt="Ichigo Kurosaki">
            </div>
            <div class="character-info">
                <h3 id="char-name">Humano / Shinigami Substituto</h3>
                <span id="char-status">Nenhum alerta ativo</span>
            </div>
        </div>
    </div>

    <script>
        const databaseURL = "https://painel-wi-fi-default-rtdb.firebaseio.com";
        const container = document.getElementById('painel-reles');
        const totalReles = 8;

        const transformacoesIchigo = {
            "NENHUM": {
                nome: "Ichigo Kurosaki (Padrão)",
                status: "Sistema Operando Normalmente",
                imagem: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400",
                corDestaque: "rgba(255, 255, 255, 0.15)",
                brilhoTitulo: "0 2px 8px rgba(0,0,0,0.8)"
            },
            "DEFEITO1": {
                nome: "Shikai (Zangetsu)",
                status: "Alerta em DEFEITO 1",
                imagem: "shikai.jpg", // Aponta corretamente para a imagem local do repositório[cite: 2]
                corDestaque: "#38bdf8",
                brilhoTitulo: "0 0 15px rgba(56, 189, 248, 0.9), 0 0 30px rgba(56, 189, 248, 0.5)"
            },
            "DEFEITO2": {
                nome: "Bankai (Tensa Zangetsu)",
                status: "Alerta em DEFEITO 2",
                imagem: "bankai.jpg",
                corDestaque: "#71717a",
                brilhoTitulo: "0 0 15px rgba(228, 228, 231, 0.9), 0 0 30px rgba(113, 113, 122, 0.5)"
            },
            "DEFEITO3": {
                nome: "Máscara Hollow Parcial",
                status: "Alerta em DEFEITO 3",
                imagem: "https://images.unsplash.com/photo-1563089145-599997674d42?w=400",
                corDestaque: "#f59e0b",
                brilhoTitulo: "0 0 20px rgba(245, 158, 11, 0.95), 0 0 40px rgba(217, 119, 6, 0.6)"
            },
            "DEFEITO4": {
                nome: "Full Hollow (Vasto Lorde)",
                status: "Alerta Crítico - DEFEITO 4",
                imagem: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=400",
                corDestaque: "#ef4444",
                brilhoTitulo: "0 0 25px rgba(239, 68, 68, 1), 0 0 50px rgba(185, 28, 28, 0.7)"
            },
            "DEFEITO5": {
                nome: "Ichigo Final (Mugetsu)",
                status: "Alerta em DEFEITO 5",
                imagem: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400",
                corDestaque: "#a855f7",
                brilhoTitulo: "0 0 25px rgba(168, 85, 247, 1), 0 0 50px rgba(126, 34, 206, 0.7)"
            },
            "DEFEITO6": {
                nome: "Fullbring Shikai",
                status: "Alerta em DEFEITO 6",
                imagem: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400",
                corDestaque: "#10b981",
                brilhoTitulo: "0 0 20px rgba(16, 185, 129, 0.9), 0 0 40px rgba(5, 150, 105, 0.6)"
            },
            "DEFEITO7": {
                nome: "True Bankai",
                status: "Alerta em DEFEITO 7",
                imagem: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=400",
                corDestaque: "#06b6d4",
                brilhoTitulo: "0 0 20px rgba(6, 182, 212, 0.9), 0 0 40px rgba(8, 145, 178, 0.6)"
            },
            "DEFEITO8": {
                nome: "Horn of Salvation",
                status: "Alerta Máximo - DEFEITO 8",
                imagem: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=400",
                corDestaque: "#eab308",
                brilhoTitulo: "0 0 25px rgba(234, 179, 8, 1), 0 0 50px rgba(202, 138, 4, 0.7)"
            }
        };

        for (let i = 1; i <= totalReles; i++) {
            const defectKey = `DEFEITO${i}`;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>Relé ${i} (${defectKey})</h3>
                <label class="switch">
                    <input type="checkbox" id="${defectKey}" onchange="atualizarFirebase('${defectKey}', this.checked)">
                    <span class="slider"></span>
                </label>
            `;
            container.appendChild(card);
        }

        function atualizarVisualPersonagem() {
            let ativoEncontrado = false;
            const bgLayer = document.getElementById('bg-transition-layer');

            for (let i = 1; i <= totalReles; i++) {
                const defectKey = `DEFEITO${i}`;
                const checkbox = document.getElementById(defectKey);
                
                if (checkbox && checkbox.checked) {
                    const dados = transformacoesIchigo[defectKey];
                    document.getElementById('char-name').innerText = dados.nome;
                    document.getElementById('char-status').innerText = dados.status;
                    document.getElementById('char-image').src = dados.imagem;
                    
                    bgLayer.style.backgroundImage = `url('${dados.imagem}')`;
                    
                    const titulo = document.getElementById('main-title');
                    titulo.style.textShadow = dados.brilhoTitulo;
                    titulo.style.color = dados.corDestaque;
                    
                    const cardBox = document.getElementById('char-card-box');
                    cardBox.style.borderColor = dados.corDestaque;
                    cardBox.style.boxShadow = `0 10px 30px ${dados.corDestaque}66`;
                    
                    ativoEncontrado = true;
                    break; 
                }
            }

            if (!ativoEncontrado) {
                const padrao = transformacoesIchigo["NENHUM"];
                document.getElementById('char-name').innerText = padrao.nome;
                document.getElementById('char-status').innerText = padrao.status;
                document.getElementById('char-image').src = padrao.imagem;
                
                bgLayer.style.backgroundImage = `url('${padrao.imagem}')`;
                
                const titulo = document.getElementById('main-title');
                titulo.style.textShadow = padrao.brilhoTitulo;
                titulo.style.color = "#f1f5f9";
                
                const cardBox = document.getElementById('char-card-box');
                cardBox.style.borderColor = 'rgba(255, 255, 255, 0.15)';
                cardBox.style.boxShadow = '0 10px 25px rgba(0,0,0,0.6)';
            }
        }

        function atualizarFirebase(chave, status) {
            fetch(`${databaseURL}/${chave}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(status)
            })
            .then(res => {
                if (!res.ok) throw new Error("Erro na resposta do servidor");
                return res.json();
            })
            .then(data => {
                console.log(`Atualizado ${chave}:`, data);
                atualizarVisualPersonagem();
            })
            .catch(error => console.error("Erro ao enviar comando:", error));
        }

        function buscarEstadosIniciais() {
            fetch(`${databaseURL}/.json`)
                .then(res => {
                    if (!res.ok) throw new Error("Erro ao conectar com o Firebase");
                    return res.json();
                })
                .then(dados => {
                    if (!dados) return;
                    for (let i = 1; i <= totalReles; i++) {
                        const defectKey = `DEFEITO${i}`;
                        const checkbox = document.getElementById(defectKey);
                        if (checkbox && dados[defectKey] !== undefined) {
                            const valor = dados[defectKey];
                            checkbox.checked = (valor === true || valor === 1 || valor === "true");
                        }
                    }
                    atualizarVisualPersonagem();
                })
                .catch(err => console.log("Aguardando resposta ou sem dados no Firebase..."));
        }

        buscarEstadosIniciais();
        setInterval(buscarEstadosIniciais, 3000);
    </script>
</body>
</html>
